[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-temporal-agent"
version = "0.1.0"
description = "Explicit temporal plans and reproducible execution for clinical database questions"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
temporal-agent = "temporal_agent.cli:main"

[tool.setuptools.packages.find]
include = ["temporal_agent*"]
